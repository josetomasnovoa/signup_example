# Kanal MCP server (Streamable HTTP at POST /mcp).
# External clients (Claude Desktop, Claude.ai web) authenticate per request
# via `Authorization: Bearer kn_live_…`.
#
# Deploy with: fly deploy -c infra/fly/mcp.fly.toml -a kanal-mcp
#
# Required Fly secrets:
#   KANAL_API_URL  https://api.kanal.app  (or whatever the API is reachable at)

app = "kanal-mcp"
primary_region = "iad"

[build]
  dockerfile = "../docker/Dockerfile.mcp"
  ignorefile = "../../.dockerignore"

[env]
  KANAL_MCP_TRANSPORT = "http"
  MCP_PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "OPTIONS"
    timeout = "3s"
    path = "/mcp"
    type = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
